<!-- gallery.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery / Paintings — vincentlarkin.com</title>
  <link rel="icon" href="/images/favicons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicons/favicon-16x16.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="theme-dark" data-page="gallery">
  <div id="site-header"></div>
  
  <div id="page-content">
    <main class="gallery-page">
      <h2 id="gallery-title">Gallery / Paintings</h2>
      <p id="gallery-description">Monthly images and my painting collection.</p>
      
      <!-- Monthly Gallery Section -->
      <button class="section-toggle" onclick="toggleSection('monthly-section')" id="monthly-toggle">
        <span id="monthly-label">Monthly Gallery</span>
        <span class="toggle-icon">▲</span>
      </button>
      <div class="section-content" id="monthly-section" style="display: block;">
        <div id="gallery-container" class="gallery-container"></div>
      </div>
      
      <!-- Paintings Section -->
      <button class="section-toggle" onclick="toggleSection('paintings-section')" id="paintings-toggle">
        <span id="paintings-label">Paintings</span>
        <span class="toggle-icon">▲</span>
      </button>
      <div class="section-content" id="paintings-section" style="display: block;">
        <p id="paintings-description" style="margin-bottom: 1rem;">A collection of paintings and images I like.</p>
        <div id="paintings-container"></div>
      </div>
    </main>
    
    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
      <span class="lightbox-close" onclick="closeLightbox(event)">×</span>
      <img id="lightbox-img" class="lightbox-content" src="" alt="">
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>
  
  <div id="site-footer"></div>
  
  <script>
    (function() {
      const page = 'gallery';
      const navId = 'nav-gallery';

      function cleanVersion(value) {
        if (!value) return null;
        return value.replace(/"/g, '').trim();
      }

      function getAssetVersion(path) {
        return fetch(path, { method: 'HEAD', cache: 'no-store' })
          .then(response => {
            if (!response.ok) throw new Error('head failed');
            return cleanVersion(response.headers.get('etag') || response.headers.get('last-modified'));
          })
          .catch(() => null)
          .then(version => {
            if (version) return encodeURIComponent(version);
            const lastMod = document.lastModified && document.lastModified !== '0'
              ? document.lastModified
              : null;
            return encodeURIComponent(lastMod || String(Date.now()));
          });
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.async = false;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error('load failed'));
          document.head.appendChild(script);
        });
      }

      function loadScriptWithVersion(path) {
        return getAssetVersion(path).then(version => loadScript(path + '?v=' + version));
      }

      function boot() {
        if (window.siteUtils && siteUtils.initPage) {
          siteUtils.initPage(page, navId);
        } else if (window.siteUtils && siteUtils.loadHeaderFooter) {
          siteUtils.loadHeaderFooter(navId, page);
        }
      }

      loadScriptWithVersion('/js/i18n.js')
        .then(() => loadScriptWithVersion('/js/site.js'))
        .then(boot)
        .catch(() => {
          const fallback = encodeURIComponent(String(Date.now()));
          loadScript('/js/i18n.js?v=' + fallback)
            .then(() => loadScript('/js/site.js?v=' + fallback))
            .then(boot);
        });
    })();
  </script>
</body>
</html>
