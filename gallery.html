<!-- gallery.html -->
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — vincentlarkin.com</title>
  <link rel="icon" href="/images/favicons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicons/favicon-16x16.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="theme-dark">
  <div id="site-header"></div>
  
  <main>
    <section class="gallery-section">
      <h2 id="gallery-title">Gallery</h2>
      <p id="gallery-description">Monthly images and videos organized by year.</p>
      
      <div class="gallery-nav">
        <a href="/paintings.html" id="gallery-paintings-link" class="gallery-nav-link">→ Paintings</a>
      </div>
      
      <div id="gallery-container" class="gallery-container"></div>
    </section>
  </main>
  
  <div id="site-footer"></div>
  
  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
    <span class="lightbox-close" onclick="closeLightbox(event)">×</span>
    <img id="lightbox-img" class="lightbox-content" src="" alt="">
    <div id="lightbox-caption" class="lightbox-caption"></div>
  </div>
  
  <script src="/js/site.js"></script>
  <script>
    siteUtils.loadHeaderFooter('nav-gallery');
    
    // Gallery data
    const monthlyImages = {
      "2026": [{ file: "janeiro-2026.webp", month: "janeiro", year: 2026, type: "image" }],
      "2025": [
        { file: "novembro-2025.webp", month: "novembro", year: 2025, type: "image" },
        { file: "outubro-2025.webp", month: "outubro", year: 2025, type: "image" },
        { file: "setembro2025.webp", month: "setembro", year: 2025, type: "image" },
        { file: "agostode2025.webp", month: "agosto", year: 2025, type: "image" }
      ]
    };

    const monthNames = {
      pt: { janeiro: "Janeiro", fevereiro: "Fevereiro", março: "Março", abril: "Abril", maio: "Maio", junho: "Junho", julho: "Julho", agosto: "Agosto", setembro: "Setembro", outubro: "Outubro", novembro: "Novembro", dezembro: "Dezembro" },
      en: { janeiro: "January", fevereiro: "February", março: "March", abril: "April", maio: "May", junho: "June", julho: "July", agosto: "August", setembro: "September", outubro: "October", novembro: "November", dezembro: "December" }
    };

    function renderGallery() {
      const container = document.getElementById('gallery-container');
      const currentLang = siteUtils.getCurrentLang();
      const months = monthNames[currentLang];
      
      let html = '';
      const years = Object.keys(monthlyImages).sort((a, b) => parseInt(b) - parseInt(a));
      
      years.forEach(year => {
        const yearItems = monthlyImages[year];
        const yearId = `year-${year}`;
        
        html += `
          <div class="gallery-year-section">
            <button class="gallery-year-toggle" onclick="toggleYear('${yearId}')">
              <span class="year-label">${year}</span>
              <span class="toggle-icon">▼</span>
            </button>
            <div class="gallery-year-content" id="${yearId}">
              <div class="gallery-grid">
        `;
        
        yearItems.forEach(item => {
          const monthName = months[item.month] || item.month;
          const filePath = `/images/mês/${item.file}`;
          
          html += `
            <div class="gallery-item">
              <div class="gallery-item-container">
                <img src="${filePath}" alt="${monthName} ${item.year}" class="gallery-media" loading="lazy" onclick="openLightbox('${filePath}', '${monthName} ${item.year}')">
              </div>
              <div class="gallery-item-caption">${monthName} ${item.year}</div>
            </div>
          `;
        });
        
        html += '</div></div></div>';
      });
      
      container.innerHTML = html;
      
      // Expand first year by default
      if (years.length > 0) {
        const firstYearContent = document.getElementById(`year-${years[0]}`);
        if (firstYearContent) {
          firstYearContent.style.display = 'block';
          firstYearContent.previousElementSibling.querySelector('.toggle-icon').textContent = '▲';
        }
      }
    }

    function toggleYear(yearId) {
      const content = document.getElementById(yearId);
      const icon = content.previousElementSibling.querySelector('.toggle-icon');
      if (content.style.display === 'none' || !content.style.display) {
        content.style.display = 'block';
        icon.textContent = '▲';
      } else {
        content.style.display = 'none';
        icon.textContent = '▼';
      }
    }
    window.toggleYear = toggleYear;

    // Lightbox functions
    function openLightbox(src, caption) {
      document.getElementById('lightbox').style.display = 'flex';
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-caption').textContent = caption || '';
      document.body.style.overflow = 'hidden';
    }
    
    function closeLightbox(event) {
      if (event.target.id === 'lightbox' || event.target.classList.contains('lightbox-close')) {
        document.getElementById('lightbox').style.display = 'none';
        document.body.style.overflow = 'auto';
      }
    }
    
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        document.getElementById('lightbox').style.display = 'none';
        document.body.style.overflow = 'auto';
      }
    });
    
    window.openLightbox = openLightbox;
    window.closeLightbox = closeLightbox;

    // Page translations
    function applyPageTranslations(lang) {
      document.getElementById('gallery-title').textContent = lang === 'pt' ? 'Galeria' : 'Gallery';
      document.getElementById('gallery-description').textContent = lang === 'pt' 
        ? 'Imagens e vídeos mensais organizados por ano.' 
        : 'Monthly images and videos organized by year.';
      document.getElementById('gallery-paintings-link').textContent = lang === 'pt' ? '→ Pinturas' : '→ Paintings';
      renderGallery(); // Re-render with new month names
    }
    
    document.addEventListener('languageChanged', (e) => applyPageTranslations(e.detail.lang));
    document.addEventListener('DOMContentLoaded', () => {
      renderGallery();
      applyPageTranslations(siteUtils.getCurrentLang());
    });
  </script>
</body>
</html>
