<!-- gallery.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery / Paintings — vincentlarkin.com</title>
  <link rel="icon" href="/images/favicons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicons/favicon-16x16.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="theme-dark" data-page="gallery">
  <div id="site-header"></div>
  
  <div id="page-content">
    <main class="gallery-page">
      <h2 id="gallery-title">Gallery / Paintings</h2>
      <p id="gallery-description">Monthly images and my painting collection.</p>
      
      <!-- Monthly Gallery Section -->
      <button class="section-toggle" onclick="toggleSection('monthly-section')" id="monthly-toggle">
        <span id="monthly-label">Monthly Gallery</span>
        <span class="toggle-icon">▲</span>
      </button>
      <div class="section-content" id="monthly-section" style="display: block;">
        <div id="gallery-container" class="gallery-container"></div>
      </div>
      
      <!-- Paintings Section -->
      <button class="section-toggle" onclick="toggleSection('paintings-section')" id="paintings-toggle">
        <span id="paintings-label">Paintings</span>
        <span class="toggle-icon">▲</span>
      </button>
      <div class="section-content" id="paintings-section" style="display: block;">
        <p id="paintings-description" style="margin-bottom: 1rem;">A collection of paintings and images I like.</p>
        <div id="paintings-container"></div>
      </div>
    </main>
    
    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
      <span class="lightbox-close" onclick="closeLightbox(event)">×</span>
      <img id="lightbox-img" class="lightbox-content" src="" alt="">
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>
  
  <div id="site-footer"></div>
  
  <script src="/js/i18n.js"></script>
  <script src="/js/site.js"></script>
  <script>
    siteUtils.initPage('gallery', 'nav-gallery');
  </script>
</body>
</html>
