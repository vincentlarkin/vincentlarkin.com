<!-- changelog.html -->
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changelog — vincentlarkin.com</title>
  <link rel="icon" href="/images/favicons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicons/favicon-16x16.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-dark">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'theme-light') {
        document.body.className = 'theme-light';
      }
    })();
  </script>
  
  <div id="site-header"></div>
  <script>
    fetch('/header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('site-header').innerHTML = html;
        
        document.querySelectorAll('.nav a').forEach(link => {
          if (link.id === 'nav-changelog') link.classList.add('active');
        });
        
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', function() {
          const isDark = document.body.classList.contains('theme-dark');
          document.body.className = isDark ? 'theme-light' : 'theme-dark';
          localStorage.setItem('theme', document.body.className);
          themeBtn.textContent = isDark ? '◑' : '◐';
        });
        themeBtn.textContent = document.body.classList.contains('theme-dark') ? '◐' : '◑';
        
        const langBtn = document.getElementById('lang-toggle');
        let currentLang = localStorage.getItem('lang') || 'pt';
        
        function applyLang(lang) {
          langBtn.textContent = lang.toUpperCase();
          langBtn.className = 'ctrl-btn lang-' + lang;
          
          const navTexts = {
            pt: { 'nav-news': 'Notícias', 'nav-paintings': 'Pinturas', 'nav-gallery': 'Galeria', 'nav-about': 'Sobre', 'nav-changelog': 'Changelog' },
            en: { 'nav-news': 'News', 'nav-paintings': 'Paintings', 'nav-gallery': 'Gallery', 'nav-about': 'About', 'nav-changelog': 'Changelog' }
          };
          Object.entries(navTexts[lang]).forEach(([id, text]) => {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
          });
          
          document.getElementById('changelog-title').textContent = 'Changelog';
          document.getElementById('changelog-subtitle').textContent = lang === 'pt' 
            ? 'Atualizações recentes do site' 
            : 'Recent site updates';
          
          refreshCommitDates();
        }
        
        langBtn.addEventListener('click', function() {
          currentLang = currentLang === 'pt' ? 'en' : 'pt';
          localStorage.setItem('lang', currentLang);
          applyLang(currentLang);
        });
        
        applyLang(currentLang);
      });
  </script>
  
  <main>
    <section class="changelog-section">
      <h2 id="changelog-title">Changelog</h2>
      <p id="changelog-subtitle">Recent site updates</p>
      <p class="changelog-source">Source: <a href="https://github.com/vincentlarkin/vincentlarkin.com" target="_blank">GitHub Repository</a></p>
      
      <div id="commits-container" class="commits-container">
        <div class="loading">Loading commits...</div>
      </div>
    </section>
  </main>
  
  <div id="site-footer"></div>
  <script>
    fetch('/footer.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('site-footer').innerHTML = html;
        document.getElementById('copyright-year').textContent = new Date().getFullYear();
      });
  </script>
  
  <script>
    const GITHUB_USERNAME = 'vincentlarkin';
    const GITHUB_REPO = 'vincentlarkin.com';
    const COMMITS_TO_FETCH = 15;
    
    function formatDate(date, lang) {
      const locale = lang === 'pt' ? 'pt-PT' : 'en-US';
      return date.toLocaleDateString(locale, { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function fetchUserAvatar(username) {
      try {
        const response = await fetch(`https://api.github.com/users/${username}`);
        if (response.ok) return await response.json();
      } catch (e) {}
      return { avatar_url: `https://github.com/${username}.png` };
    }
    
    async function fetchCommits() {
      const container = document.getElementById('commits-container');
      
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/commits?per_page=${COMMITS_TO_FETCH}`);
        if (!response.ok) throw new Error('API error');
        
        const commits = await response.json();
        if (commits.length === 0) {
          container.innerHTML = '<div class="no-commits">No commits found</div>';
          return;
        }

        const userData = await fetchUserAvatar(GITHUB_USERNAME);
        const currentLang = localStorage.getItem('lang') || 'pt';

        const commitsHTML = commits.map(commit => {
          const commitDate = new Date(commit.commit.author.date);
          const formattedDate = formatDate(commitDate, currentLang);
          const shortHash = commit.sha.substring(0, 7);
          const commitUrl = `https://github.com/${GITHUB_USERNAME}/${GITHUB_REPO}/commit/${commit.sha}`;
          const messageLines = commit.commit.message.split('\n');
          const title = messageLines[0];

          let description = '';
          for (let i = 1; i < messageLines.length; i++) {
            if (messageLines[i].trim() === '') {
              description = messageLines.slice(i + 1).filter(line => line.trim()).join('\n');
              break;
            }
          }

          return `
            <div class="commit-item">
              <div class="commit-avatar">
                <img src="${userData.avatar_url}" alt="Profile" class="profile-pic">
              </div>
              <div class="commit-content">
                <div class="commit-header">
                  <a href="${commitUrl}" target="_blank"><span class="commit-hash">${shortHash}</span></a>
                  <span class="commit-date" data-original-date="${commit.commit.author.date}">${formattedDate}</span>
                </div>
                <div class="commit-message">${escapeHtml(title)}</div>
                ${description ? `<div class="commit-description">${escapeHtml(description)}</div>` : ''}
                <div class="commit-author">${escapeHtml(commit.commit.author.name)}</div>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML = commitsHTML;
        
      } catch (error) {
        container.innerHTML = '<div class="error-message">Could not load commits from GitHub.</div>';
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function refreshCommitDates() {
      const currentLang = localStorage.getItem('lang') || 'pt';
      document.querySelectorAll('.commit-date[data-original-date]').forEach(el => {
        const date = new Date(el.dataset.originalDate);
        el.textContent = formatDate(date, currentLang);
      });
    }
  
    document.addEventListener('DOMContentLoaded', fetchCommits);
  </script>
</body>
</html>
