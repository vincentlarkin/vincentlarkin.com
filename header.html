<header class="header">
  <a href="/" class="site-id">
    <img src="/images/site-emblem.png" alt="emblem">
    <span>vincentlarkin.com</span>
  </a>
  <div class="header-holiday-slot">
    <div class="holiday-monitor" id="holiday-monitor" role="status" aria-live="polite" hidden>
      <span class="holiday-monitor-particles" id="holiday-particles" aria-hidden="true"></span>
      <span class="holiday-monitor-icon" id="holiday-icon" aria-hidden="true"></span>
      <span class="holiday-monitor-text" id="holiday-text"></span>
    </div>
  </div>
  <div class="header-controls">
    <label class="visually-hidden" for="theme-toggle">Theme</label>
    <div class="theme-selector">
      <span class="theme-selector-icon" aria-hidden="true"></span>
      <select class="ctrl-btn" id="theme-toggle" title="Select Theme" aria-label="Select theme">
        <option value="theme-vin">Life of a VIN</option>
        <option value="theme-dark">Dark Theme</option>
        <option value="theme-retro">Retro Theme</option>
      </select>
    </div>
    <label class="visually-hidden" for="lang-toggle">Language</label>
    <div class="lang-selector">
      <span class="lang-selector-flag" id="lang-flag" aria-hidden="true"></span>
      <select class="ctrl-btn lang-en" id="lang-toggle" title="Select Language" aria-label="Select language">
        <option value="en">EN</option>
        <option value="pt">PT</option>
      </select>
    </div>
  </div>
</header>

<nav class="nav">
  <a href="/" id="nav-home">Home</a>

</nav>
