  <div class="header-holiday-slot">
    <div class="holiday-monitor" id="holiday-monitor" role="status" aria-live="polite" hidden>

      <span class="holiday-monitor-text" id="holiday-text"></span>

  </div>
  <div class="header-controls">
    <div class="custom-select" id="theme-select" data-name="theme">
      <button type="button" class="cs-trigger" data-name="theme" aria-haspopup="listbox" aria-expanded="false" aria-label="Select theme">

      </ul>

    <div class="custom-select" id="lang-select" data-name="lang">
      <button type="button" class="cs-trigger" data-name="lang" aria-haspopup="listbox" aria-expanded="false" aria-label="Select language">
        <img class="cs-flag" src="/images/flags/us.png" alt="">

        <span class="cs-arrow" aria-hidden="true">&#9662;</span>
      </button>

        <li class="cs-option" role="option" data-value="en"><img class="cs-flag" src="/images/flags/us.png" alt=""><span>English</span></li>
        <li class="cs-option" role="option" data-value="pt"><img class="cs-flag" src="/images/flags/pt.svg" alt=""><span>Português</span></li>
        <li class="cs-option" role="option" data-value="ja"><img class="cs-flag" src="/images/flags/jp.svg" alt=""><span>日本語</span></li>
      </ul>
    </div>
