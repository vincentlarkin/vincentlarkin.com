<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>vincentlarkin.com</title>
  <link rel="canonical" href="https://vincentlarkin.com/">
  <link rel="icon" href="/images/favicons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicons/favicon-16x16.png">
  <link rel="manifest" href="/images/favicons/site.webmanifest">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="theme-dark" data-page="index">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'theme-light') {
        document.body.className = 'theme-light';
      }
    })();
  </script>
  
  <div id="site-header"></div>

  <div id="page-content">
    <main class="home-main">
      <section class="intro-block">
        <h1 id="welcome-title">Loading...</h1>
        <p id="intro-text">Loading...</p>
        <div class="status-row">
          <span class="status-dot"></span>
          <a href="https://status.vincentlarkin.com" target="_blank" id="status-text" class="status-link">site online</a>
        </div>
      </section>
      
      <section class="monthly-block">
        <div class="monthly-label" id="monthly-label">Image of the Month</div>
        <div class="monthly-frame">
          <img src="/images/mês/fevereiro-2026.jpg" alt="February 2026" id="monthly-image" onclick="openLightbox(this.src, document.getElementById('monthly-caption').textContent)">
        </div>
        <div class="monthly-caption" id="monthly-caption">February 2026</div>
      </section>
      
      <section class="links-block">
        <div class="links-label" id="links-label">Quick Links</div>
        <div class="links-grid">
          <a href="/about.html" class="link-item" id="link-about">
            <span>About</span>
            <span class="arrow">→</span>
          </a>
          <a href="/gallery.html" class="link-item" id="link-gallery">
            <span>Gallery</span>
            <span class="arrow">→</span>
          </a>
        </div>
      </section>
    </main>
    
    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
      <span class="lightbox-close" onclick="closeLightbox(event)">×</span>
      <img id="lightbox-img" class="lightbox-content" src="" alt="">
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>
  
  <div id="site-footer"></div>
  
  <script>
    (function() {
      const page = 'index';
      const navId = 'nav-home';

      function cleanVersion(value) {
        if (!value) return null;
        return value.replace(/"/g, '').trim();
      }

      function getAssetVersion(path) {
        return fetch(path, { method: 'HEAD', cache: 'no-store' })
          .then(response => {
            if (!response.ok) throw new Error('head failed');
            return cleanVersion(response.headers.get('etag') || response.headers.get('last-modified'));
          })
          .catch(() => null)
          .then(version => {
            if (version) return encodeURIComponent(version);
            const lastMod = document.lastModified && document.lastModified !== '0'
              ? document.lastModified
              : null;
            return encodeURIComponent(lastMod || String(Date.now()));
          });
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.async = false;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error('load failed'));
          document.head.appendChild(script);
        });
      }

      function loadScriptWithVersion(path) {
        return getAssetVersion(path).then(version => loadScript(path + '?v=' + version));
      }

      function boot() {
        if (window.siteUtils && siteUtils.initPage) {
          siteUtils.initPage(page, navId);
        } else if (window.siteUtils && siteUtils.loadHeaderFooter) {
          siteUtils.loadHeaderFooter(navId, page);
        }
      }

      loadScriptWithVersion('/js/i18n.js')
        .then(() => loadScriptWithVersion('/js/site.js'))
        .then(boot)
        .catch(() => {
          const fallback = encodeURIComponent(String(Date.now()));
          loadScript('/js/i18n.js?v=' + fallback)
            .then(() => loadScript('/js/site.js?v=' + fallback))
            .then(boot);
        });
    })();
  </script>
</body>
</html>
