name: Deploy to TrueNAS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@05c58255396c88c609919d571a8b117099c69020 # v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            echo "Starting deployment..."

            WEBROOT="/mnt/Pool3x2/web"
            LIVE_DIR="${WEBROOT}/vincentlarkin"
            REPO_URL="https://github.com/vincentlarkin/vincentlarkin.com.git"
            TMP_BASE="${WEBROOT}/.deploy_tmp"
            NGINX_CONTAINER="ix-my-website-my-website-1"
            TS="$(date +%Y%m%d_%H%M%S)"
            WORK_DIR="${TMP_BASE}/vincentlarkin_${TS}"
            NEW_DIR="${TMP_BASE}/vincentlarkin_live_${TS}"
            OLD_DIR="${TMP_BASE}/vincentlarkin_old_${TS}"

            if [ ! -d "$WEBROOT" ]; then
              echo "❌ Error: $WEBROOT directory does not exist!"
              exit 1
            fi

            mkdir -p "$TMP_BASE"

            echo "Cloning repo into temp workspace: $WORK_DIR"
            rm -rf "$WORK_DIR" "$NEW_DIR"
            git clone --depth 1 "$REPO_URL" "$WORK_DIR"

            echo "Preparing clean deploy directory (no .git)..."
            rsync -a --delete \
              --exclude '.git' \
              --exclude '.github' \
              "$WORK_DIR"/ "$NEW_DIR"/

            if [ -d "$NEW_DIR/.git" ]; then
              echo "❌ Safety check failed: .git exists in new deploy dir"
              exit 1
            fi

            if [ -d "$LIVE_DIR" ]; then
              echo "Swapping current live dir..."
              mv "$LIVE_DIR" "$OLD_DIR"
            fi

            echo "Activating new release -> $LIVE_DIR"
            mv "$NEW_DIR" "$LIVE_DIR"

            echo "Cleaning temporary deploy folders..."
            rm -rf "$WORK_DIR" "$OLD_DIR"

            echo "Repository deployed (clean, no .git)."

            if ! command -v docker >/dev/null 2>&1; then
              echo "⚠️  Warning: docker command not found, skipping reload"
            elif [ "$(docker inspect -f '{{.State.Running}}' "$NGINX_CONTAINER" 2>/dev/null || true)" = "true" ]; then
              if docker exec "$NGINX_CONTAINER" nginx -t; then
                docker exec "$NGINX_CONTAINER" nginx -s reload
                echo "✅ Nginx reloaded successfully"
              else
                echo "⚠️  Nginx config test failed; not reloading"
                exit 1
              fi
            else
              echo "⚠️  Warning: nginx container '$NGINX_CONTAINER' not running or not found, skipping reload"
            fi

            test ! -d "$LIVE_DIR/.git" && echo "✅ .git not present in live dir"
            echo "✅ Deployed vincentlarkin.com at $(date -Is)"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed! Check the logs above for details."
