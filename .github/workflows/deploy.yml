name: Deploy to TrueNAS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e  # Exit on any error
            
            echo "Starting deployment..."
            
            # Verify the web directory exists
            if [ ! -d "/mnt/Pool3x2/web" ]; then
              echo "❌ Error: /mnt/Pool3x2/web directory does not exist!"
              echo "Please check your TrueNAS volume mount configuration."
              exit 1
            fi
            
            # Clone or update the repository
            if [ -d "/mnt/Pool3x2/web/vincentlarkin/.git" ]; then
              echo "Repository exists, pulling latest changes..."
              cd /mnt/Pool3x2/web/vincentlarkin || { echo "❌ Failed to cd into vincentlarkin"; exit 1; }
              
              if ! git pull origin main; then
                echo "❌ Git pull failed, attempting to reset..."
                git fetch origin
                git reset --hard origin/main || { echo "❌ Git reset failed"; exit 1; }
              fi
            else
              echo "Repository doesn't exist, cloning..."
              cd /mnt/Pool3x2/web || { echo "❌ Failed to cd into web directory"; exit 1; }
              
              if ! git clone https://github.com/vincentlarkin/vincentlarkin.com.git vincentlarkin; then
                echo "❌ Git clone failed"
                exit 1
              fi
            fi
            
            echo "Repository updated successfully"
            
            # Check if nginx container is running
            if ! docker ps | grep -q "ix-my-website-my-website-1"; then
              echo "⚠️  Warning: nginx container not running, skipping reload"
            else
              # Reload nginx
              if docker exec ix-my-website-my-website-1 nginx -s reload; then
                echo "✅ Nginx reloaded successfully"
              else
                echo "⚠️  Warning: Nginx reload failed, but files were updated"
              fi
            fi
            
            echo "✅ Deployed vincentlarkin.com at $(date)"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed! Check the logs above for details."
