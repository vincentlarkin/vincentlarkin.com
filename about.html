<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — vincentlarkin.com</title>
  <link rel="icon" href="/images/favicons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicons/favicon-16x16.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="theme-dark" data-page="about">
  <div id="site-header"></div>
  
  <div id="page-content">
    <main>
      <h1 id="about-title">About</h1>
      
      <div class="about-grid">
        <section class="about-section">
          <div class="about-section-header" id="personal-info-title">Personal Information</div>
          <div class="about-section-content">
            <div class="about-row">
              <div class="about-row-label" id="label-occupation">Occupation</div>
              <div class="about-row-value" id="value-occupation">Director of Operations</div>
            </div>
            <div class="about-row">
              <div class="about-row-label" id="label-employer">Employer</div>
              <div class="about-row-value">Med Mission Supplies</div>
            </div>
          </div>
        </section>

        <section class="about-section">
          <div class="about-section-header" id="contact-title">Contact</div>
          <div class="about-section-content">
            <div class="about-row">
              <div class="about-row-label" id="label-github">Github</div>
              <div class="about-row-value"><a href="https://github.com/vincentlarkin" target="_blank">vincentlarkin</a></div>
            </div>
            <div class="about-row">
              <div class="about-row-label" id="label-linkedin">LinkedIn</div>
              <div class="about-row-value"><a href="https://www.linkedin.com/in/vincentwlarkin/" target="_blank">vincentwlarkin</a></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="site-footer"></div>
  
  <script>
    (function() {
      const page = 'about';
      const navId = 'nav-about';

      function cleanVersion(value) {
        if (!value) return null;
        return value.replace(/"/g, '').trim();
      }

      function getAssetVersion(path) {
        return fetch(path, { method: 'HEAD', cache: 'no-store' })
          .then(response => {
            if (!response.ok) throw new Error('head failed');
            return cleanVersion(response.headers.get('etag') || response.headers.get('last-modified'));
          })
          .catch(() => null)
          .then(version => {
            if (version) return encodeURIComponent(version);
            const lastMod = document.lastModified && document.lastModified !== '0'
              ? document.lastModified
              : null;
            return encodeURIComponent(lastMod || String(Date.now()));
          });
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.async = false;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error('load failed'));
          document.head.appendChild(script);
        });
      }

      function loadScriptWithVersion(path) {
        return getAssetVersion(path).then(version => loadScript(path + '?v=' + version));
      }

      function boot() {
        if (window.siteUtils && siteUtils.initPage) {
          siteUtils.initPage(page, navId);
        } else if (window.siteUtils && siteUtils.loadHeaderFooter) {
          siteUtils.loadHeaderFooter(navId, page);
        }
      }

      loadScriptWithVersion('/js/i18n.js')
        .then(() => loadScriptWithVersion('/js/site.js'))
        .then(boot)
        .catch(() => {
          const fallback = encodeURIComponent(String(Date.now()));
          loadScript('/js/i18n.js?v=' + fallback)
            .then(() => loadScript('/js/site.js?v=' + fallback))
            .then(boot);
        });
    })();
  </script>
</body>
</html>
