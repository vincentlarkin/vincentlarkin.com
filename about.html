<!-- about.html -->
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — vincentlarkin.com</title>
  <link rel="icon" href="/images/favicons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicons/favicon-16x16.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-dark">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'theme-light') {
        document.body.className = 'theme-light';
      }
    })();
  </script>
  
  <div id="site-header"></div>
  <script>
    fetch('/header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('site-header').innerHTML = html;
        
        // Mark current page as active
        document.querySelectorAll('.nav a').forEach(link => {
          if (link.id === 'nav-about') link.classList.add('active');
        });
        
        // Theme toggle
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', function() {
          const isDark = document.body.classList.contains('theme-dark');
          document.body.className = isDark ? 'theme-light' : 'theme-dark';
          localStorage.setItem('theme', document.body.className);
          themeBtn.textContent = isDark ? '◑' : '◐';
        });
        themeBtn.textContent = document.body.classList.contains('theme-dark') ? '◐' : '◑';
        
        // Language toggle
        const langBtn = document.getElementById('lang-toggle');
        let currentLang = localStorage.getItem('lang') || 'pt';
        
        function applyLang(lang) {
          langBtn.textContent = lang.toUpperCase();
          langBtn.className = 'ctrl-btn lang-' + lang;
          
          const navTexts = {
            pt: { 'nav-news': 'Notícias / Livros', 'nav-gallery': 'Galeria / Pinturas', 'nav-about': 'Sobre', 'nav-changelog': 'Changelog' },
            en: { 'nav-news': 'News / Books', 'nav-gallery': 'Gallery / Paintings', 'nav-about': 'About', 'nav-changelog': 'Changelog' }
          };
          Object.entries(navTexts[lang]).forEach(([id, text]) => {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
          });
          
          // Update page content
          const pageTexts = {
            pt: {
              'about-title': 'Sobre',
              'personal-info-title': 'Informações Pessoais',
              'label-occupation': 'Ocupação',
              'value-occupation': 'Diretor de Operações',
              'label-employer': 'Empregador',
              'contact-title': 'Contato',
              'label-github': 'Github',
              'label-linkedin': 'LinkedIn'
            },
            en: {
              'about-title': 'About',
              'personal-info-title': 'Personal Information',
              'label-occupation': 'Occupation',
              'value-occupation': 'Director of Operations',
              'label-employer': 'Employer',
              'contact-title': 'Contact',
              'label-github': 'Github',
              'label-linkedin': 'LinkedIn'
            }
          };
          Object.entries(pageTexts[lang]).forEach(([id, text]) => {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
          });
        }
        
        langBtn.addEventListener('click', function() {
          currentLang = currentLang === 'pt' ? 'en' : 'pt';
          localStorage.setItem('lang', currentLang);
          applyLang(currentLang);
        });
        
        applyLang(currentLang);
      });
  </script>

  <main>
    <h1 id="about-title">About</h1>
    
    <div class="about-grid">
      <section class="about-section">
        <div class="about-section-header" id="personal-info-title">Personal Information</div>
        <div class="about-section-content">
          <div class="about-row">
            <div class="about-row-label" id="label-occupation">Occupation</div>
            <div class="about-row-value" id="value-occupation">Director of Operations</div>
          </div>
          <div class="about-row">
            <div class="about-row-label" id="label-employer">Employer</div>
            <div class="about-row-value" id="value-employer">Med Mission Supplies</div>
          </div>
        </div>
      </section>

      <section class="about-section">
        <div class="about-section-header" id="contact-title">Contact</div>
        <div class="about-section-content">
          <div class="about-row">
            <div class="about-row-label" id="label-github">Github</div>
            <div class="about-row-value"><a href="https://github.com/vincentlarkin" target="_blank">vincentlarkin</a></div>
          </div>
          <div class="about-row">
            <div class="about-row-label" id="label-linkedin">LinkedIn</div>
            <div class="about-row-value"><a href="https://www.linkedin.com/in/vincentwlarkin/" target="_blank">vincentwlarkin</a></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script>
    fetch('/footer.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('site-footer').innerHTML = html;
        document.getElementById('copyright-year').textContent = new Date().getFullYear();
      });
  </script>
</body>
</html>
