<!-- paintings.html -->
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paintings — vincentlarkin.com</title>
  <link rel="icon" href="/images/favicons/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicons/favicon-16x16.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-dark">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'theme-light') {
        document.body.className = 'theme-light';
      }
    })();
  </script>
  
  <div id="site-header"></div>
  <script>
    fetch('/header.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('site-header').innerHTML = html;
        
        document.querySelectorAll('.nav a').forEach(link => {
          if (link.id === 'nav-gallery') link.classList.add('active');
        });
        
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', function() {
          const isDark = document.body.classList.contains('theme-dark');
          document.body.className = isDark ? 'theme-light' : 'theme-dark';
          localStorage.setItem('theme', document.body.className);
          themeBtn.textContent = isDark ? '◑' : '◐';
        });
        themeBtn.textContent = document.body.classList.contains('theme-dark') ? '◐' : '◑';
        
        const langBtn = document.getElementById('lang-toggle');
        let currentLang = localStorage.getItem('lang') || 'pt';
        
        function applyLang(lang) {
          langBtn.textContent = lang.toUpperCase();
          langBtn.className = 'ctrl-btn lang-' + lang;
          
          const navTexts = {
            pt: { 'nav-news': 'Notícias / Livros', 'nav-gallery': 'Galeria / Pinturas', 'nav-about': 'Sobre', 'nav-changelog': 'Changelog' },
            en: { 'nav-news': 'News / Books', 'nav-gallery': 'Gallery / Paintings', 'nav-about': 'About', 'nav-changelog': 'Changelog' }
          };
          Object.entries(navTexts[lang]).forEach(([id, text]) => {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
          });
          
          document.getElementById('paintings-title').textContent = lang === 'pt' ? 'Pinturas' : 'Paintings';
          document.getElementById('paintings-description').textContent = lang === 'pt' 
            ? 'Uma coleção de pinturas e imagens que gosto.' 
            : 'A collection of paintings and images I like.';
          document.getElementById('paintings-gallery-link').textContent = lang === 'pt' ? '→ Galeria Mensal' : '→ Monthly Gallery';
        }
        
        langBtn.addEventListener('click', function() {
          currentLang = currentLang === 'pt' ? 'en' : 'pt';
          localStorage.setItem('lang', currentLang);
          applyLang(currentLang);
        });
        
        applyLang(currentLang);
      });
  </script>
  
  <main>
    <section class="gallery-section">
      <h2 id="paintings-title">Paintings</h2>
      <p id="paintings-description">A collection of paintings and images I like.</p>
      
      <div class="gallery-nav">
        <a href="/gallery.html" id="paintings-gallery-link" class="gallery-nav-link">→ Monthly Gallery</a>
      </div>
      
      <div id="paintings-container" class="gallery-container"></div>
    </section>
  </main>
  
  <div id="site-footer"></div>
  <script>
    fetch('/footer.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('site-footer').innerHTML = html;
        document.getElementById('copyright-year').textContent = new Date().getFullYear();
      });
  </script>
  
  <script>
    const paintings = [
      { file: "the-christian-general.webp", title: "The Christian General", artist: "William L. Maughan" },
      { file: "red-roses-still-life.webp", title: "Red Roses in Ornate Vase", artist: "Unattributed, circa unknown", credit: "AI assisted frame scan by Vincent L." },
      { file: "Shepherdess-with-Her-Flock.webp", title: "Shepherdess with Her Flock", artist: "Julien Dupré (1851–1910)", credit: "AI assisted frame scan by Vincent L." }
    ];

    function renderPaintings() {
      const container = document.getElementById('paintings-container');
      if (paintings.length === 0) {
        container.innerHTML = '<p style="color: var(--muted);">No paintings yet.</p>';
        return;
      }
      
      let html = '<div class="gallery-grid">';
      paintings.forEach(painting => {
        const filePath = `/images/paintings/${painting.file}`;
        const caption = `${painting.title || ''}${painting.artist ? ' - ' + painting.artist : ''}${painting.credit ? ' - ' + painting.credit : ''}`;
        html += `
          <div class="gallery-item">
            <div class="gallery-item-container">
              <img src="${filePath}" alt="${painting.title || ''}" class="gallery-media" loading="lazy" onclick="openLightbox('${filePath}', '${caption.replace(/'/g, "\\'")}')">
            </div>
            <div class="gallery-item-caption">
              ${painting.title ? `<strong>${painting.title}</strong>` : ''}
              ${painting.artist ? `<br>${painting.artist}` : ''}
              ${painting.credit ? `<br><em style="font-size: 0.85em; opacity: 0.7;">${painting.credit}</em>` : ''}
            </div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', renderPaintings);
  </script>
  
  <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
    <span class="lightbox-close" onclick="closeLightbox(event)">×</span>
    <img id="lightbox-img" class="lightbox-content" src="" alt="">
    <div id="lightbox-caption" class="lightbox-caption"></div>
  </div>
  
  <script>
    function openLightbox(src, caption) {
      document.getElementById('lightbox').style.display = 'flex';
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-caption').textContent = caption || '';
      document.body.style.overflow = 'hidden';
    }
    
    function closeLightbox(event) {
      if (event.target.id === 'lightbox' || event.target.classList.contains('lightbox-close')) {
        document.getElementById('lightbox').style.display = 'none';
        document.body.style.overflow = 'auto';
      }
    }
    
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        document.getElementById('lightbox').style.display = 'none';
        document.body.style.overflow = 'auto';
      }
    });
    
    window.openLightbox = openLightbox;
    window.closeLightbox = closeLightbox;
  </script>
</body>
</html>
