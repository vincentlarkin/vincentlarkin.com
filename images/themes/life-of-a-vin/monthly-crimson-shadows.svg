<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Crimson Shadows</title>
  <desc id="desc">Original abstract black and crimson atmospheric artwork with diagonal shadow bands.</desc>
  <defs>
    <radialGradient id="glow" cx="36%" cy="62%" r="78%">
      <stop offset="0" stop-color="#a41212" stop-opacity=".92"/>
      <stop offset=".34" stop-color="#7f0d0d" stop-opacity=".72"/>
      <stop offset=".72" stop-color="#250202" stop-opacity=".56"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="falloff" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset=".28" stop-color="#090303" stop-opacity=".7"/>
      <stop offset=".72" stop-color="#5a0a0a" stop-opacity=".46"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <filter id="softNoise">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="4" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
    </filter>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#050505"/>
  <rect width="1200" height="720" fill="url(#glow)"/>
  <rect width="1200" height="720" fill="url(#falloff)" opacity=".8"/>
  <g transform="rotate(-9 600 360)" filter="url(#blur)">
    <rect x="-90" y="120" width="1390" height="40" fill="#000" opacity=".62"/>
    <rect x="-80" y="280" width="1360" height="132" fill="#000" opacity=".78"/>
    <rect x="-110" y="590" width="1420" height="52" fill="#000" opacity=".72"/>
  </g>
  <g transform="rotate(-9 600 360)">
    <rect x="-90" y="132" width="1390" height="10" fill="#070000" opacity=".58"/>
    <rect x="-80" y="313" width="1360" height="54" fill="#050000" opacity=".46"/>
    <rect x="-110" y="606" width="1420" height="16" fill="#050000" opacity=".56"/>
  </g>
  <rect width="1200" height="720" filter="url(#softNoise)" opacity=".55"/>
  <rect width="1200" height="720" fill="none" stroke="#b08a57" stroke-opacity=".38" stroke-width="2"/>
</svg>
